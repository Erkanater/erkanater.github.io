const BD={
guide:["Путеводная башня","🧭","#2fb8a8",90,"Справочник-путеводитель: общая информация о структуре университета, службах и правилах для всех, кто знакомится с вузом.","Башня","Речь идёт о вузе в целом, а не об одной дисциплине.","Первокурснику необходимо узнать, где расположен деканат, как записаться на дисциплины и к кому обращаться за помощью.","Единая точка входа снижает когнитивную нагрузку новичка по сравнению с разрозненными объявлениями (Sweller, теория когнитивной нагрузки)."],
syl:["Дом Силлабуса","📜","#f2a900",100,"Силлабус: документ по одной дисциплине, в котором изложены темы, задания, баллы, сроки и правила.","Силлабус","Документ об одной дисциплине: баллы, сроки, правила.","Студент заранее видит, как набираются баллы, когда проводится рубежный контроль и как отрабатываются пропуски.","Прозрачные критерии повышают предсказуемость и мотивацию; согласованность целей, заданий и оценивания описывает конструктивное выравнивание (Biggs, 1996)."],
umk:["Библиотека УМК","🗃️","#5b5bd6",120,"УМК (учебно-методический комплекс): совокупность материалов дисциплины, включающая методические указания, задания и оценочные средства.","УМК","Необходим целый комплект материалов по дисциплине.","Преподаватель собирает в одном месте лекции, методические указания, задания и тесты, чтобы курс можно было воспроизвести.","Целостный комплект обеспечивает согласованность целей, методов и оценивания (Biggs, 1996)."],
rup:["Деканат РУП","🏛️","#b8b3a4",110,"РУП (рабочий учебный план) и рабочая программа: рамка, в которой определены кредиты, семестр, формы контроля и распределение часов.","РУП","Рамка программы: кредиты, семестр, форма контроля.","Деканат фиксирует, что дисциплина изучается в третьем семестре, имеет объём три кредита и завершается экзаменом.","Планирование от результатов к содержанию (обратное проектирование, Wiggins, McTighe, 1998) начинается с рамки и итоговых компетенций."],
credits:["Банк кредитов","⏰","#e6a817",100,"Кредитная технология обучения: учёт учебной нагрузки в академических кредитах. По действующим правилам Республики Казахстан один академический кредит равен 30 академическим часам, включающим аудиторную и самостоятельную работу.","Кредиты","Речь идёт об учёте часов и нагрузки студента.","Три кредита составляют 90 академических часов: часть приходится на аудиторную работу, остальное на самостоятельную работу студента.","Кредит измеряет трудозатраты студента, а не только часы в аудитории; аналогичный принцип лежит в основе европейской системы ECTS."],
lec:["Амфитеатр","🌬️","#4aa3ff",100,"Лекция: форма занятия, направленная на формирование понимания концепций и системного видения темы.","Лекция","Необходима общая картина темы и связи понятий.","Преподаватель раскрывает общую структуру темы, ключевые понятия и их взаимосвязи.","Вводная структура помогает включить новые знания в уже имеющиеся схемы; эффективность лекции повышают вопросы и паузы для активной работы (Freeman и др., 2014)."],
prac:["Практикум","⚙️","#ff9f5a",100,"Практическое занятие: отработка навыков и алгоритмов на серии заданий до уверенного применения.","Практика","Отработка навыка и алгоритма на заданиях.","Студентам предлагается серия задач возрастающей сложности с последующей взаимопроверкой по критериям.","Регулярное воспроизведение материала и повторение с интервалами закрепляют навык лучше однократного перечитывания (Roediger, Karpicke, 2006; Cepeda и др., 2006)."],
sem:["Зал дискуссий","🗣️","#ff7a8a",100,"Семинар: форма занятия, предполагающая дискуссию, аргументацию, доклады и оппонирование.","Семинар","Обсуждение, аргументы, доклады, оппонирование.","Две команды защищают разные позиции, опираясь на факты и источники.","Социальное взаимодействие развивает мышление (Л. С. Выготский); активное обсуждение повышает результаты обучения (Freeman и др., 2014)."],
lab:["Лаборатория","🧪","#3cc9a0",110,"Лабораторное занятие: эксперимент, проверка гипотез, измерения и оформление протокола исследования.","Лаборатория","Эксперимент, измерения, протокол.","Студенты формулируют гипотезу, проводят опыт, фиксируют результаты измерений и оформляют протокол.","Цикл «опыт, наблюдение, обобщение, проверка» описан в теории опытного обучения (Kolb, 1984)."],
arm:["Павильон АРМ","🧩","#9b7be0",90,"АРМ (активный раздаточный материал): опорные схемы, вопросы и задания, связанные с УМК, а также краткий итог занятия.","АРМ","Схемы с пропусками, вопросы по ходу занятия, краткий итог.","На лекции студент заполняет схему с пропусками, отвечает на вопросы по ходу занятия и записывает краткий итог.","Активное заполнение материала и самопроверка эффективнее пассивного чтения (Freeman и др., 2014; Roediger, Karpicke, 2006)."]};

["👩‍🎓 Алиса, студентка 1 курса","Уважаемый методист! Я студентка первого курса и пока плохо ориентируюсь в университете. Прошу подсказать, где находятся столовая и деканат и какие правила необходимо знать первокурснику.","guide"],
["👩 Гульнара Омаровна, родитель студента","Здравствуйте! Прошу предоставить общую информацию об университете: службы, контакты и условия проживания в общежитии. Где можно ознакомиться с ней в одном месте?","guide"],
["🧑‍🎓 Руслан, студент","Добрый день! Недавно я перевёлся из другого вуза. С чего целесообразно начать знакомство с университетом и его службами?","guide"],
["🧑‍💼 Тимур, студент","Добрый день! Прошу пояснить, где указаны баллы, сроки сдачи заданий и правила отработки пропусков именно по этой дисциплине.","syl"],
["🧑‍💼 Тимур, студент","Здравствуйте! Подскажите, пожалуйста, как в данной дисциплине оцениваются рубежные контроли и каков порядок пересдачи. Где можно ознакомиться с этими условиями?","syl"],
["👩‍🎓 Айгерим, студентка","Уважаемый методист! Я хотела бы заранее ознакомиться с темами курса, сроками заданий и критериями оценивания. В каком документе они закреплены?","syl"],
["👩‍🏫 Дана Ермековна, преподаватель","Уважаемый коллега! Преподавателям необходим единый комплект материалов по дисциплине: методические указания, задания и тесты. Какое здание следует возвести?","umk"],
["👨‍🏫 Ержан Маратович, преподаватель","Добрый день! Я предполагаю предоставить студентам открытый доступ к методическим указаниям и оценочным средствам курса. Как это целесообразно оформить?","umk"],
